# Test additions for end-to-end and load tests. Never use this file in production.
#
# - Mailpit catches every outgoing email, so tests can follow the links in them.
# - Per-IP rate limits are lifted: every browser and every k6 virtual user shares one client
#   address here, which a real team never does. The limiters keep their integration tests.
#
#   docker compose -f docker-compose.yml -f docker-compose.build.yml -f docker-compose.e2e.yml up -d --build
#   cd ../web && npm run e2e

services:
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      # Web UI and API, used by the tests to read emails.
      - "127.0.0.1:8025:8025"
    mem_limit: 64m
    labels:
      # Not part of a real deployment: perf/measure-memory.sh leaves it out.
      cadence.test-only: "true"
    # On the backend network for the app's SMTP connection; on edge so the port can be published.
    networks: [backend, edge]

  app:
    environment:
      Cadence__Email__Smtp__Host: mailpit
      Cadence__Email__Smtp__Port: "1025"
      Cadence__Email__Smtp__Security: None
      Cadence__RateLimiting__AuthPermitsPerMinute: "1000"
      Cadence__RateLimiting__ApiPermitsPerMinute: "100000"
    depends_on:
      mailpit:
        condition: service_started
