# PostgreSQL configuration for Cadence on a small host (1–2 GB RAM, SSD storage).
# The container is limited to 384 MB; these values keep PostgreSQL well inside that limit.

listen_addresses = '*'
timezone = 'UTC'
log_timezone = 'UTC'

# --- Connections ---------------------------------------------------------------
# The app pools at most 20 connections; the rest is headroom for the migrator and admin sessions.
max_connections = 25

# --- Memory -----------------------------------------------------------------
shared_buffers = 96MB
effective_cache_size = 256MB
work_mem = 4MB
maintenance_work_mem = 32MB
wal_buffers = 4MB

# Parallel query helps large analytical scans, not small OLTP queries, and costs memory per worker.
max_parallel_workers_per_gather = 1
max_worker_processes = 4

# JIT compilation adds latency and memory for short queries; Cadence's workload doesn't benefit.
jit = off

# --- Write-ahead log and checkpoints -----------------------------------------------
min_wal_size = 80MB
max_wal_size = 512MB
checkpoint_completion_target = 0.9

# --- Planner (SSD) --------------------------------------------------------------
random_page_cost = 1.1
effective_io_concurrency = 200

# --- Observability ----------------------------------------------------------------
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.max = 1000
pg_stat_statements.track = top
log_min_duration_statement = 250ms
